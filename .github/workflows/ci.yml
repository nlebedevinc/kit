name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck bin/kit install.sh lib/*.sh modules/*/*.sh hosts/*/host.conf hosts/*/modules/*.sh hosts/*/commands/* tests/helpers.bash tests/fresh-ubuntu.sh tests/stubs/*

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # macos-latest runs the suite on /bin/bash 3.2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install bats
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install bats-core; else sudo apt-get update && sudo apt-get install -y bats; fi
      - name: bats
        env:
          KIT_TEST_BASH: ${{ matrix.os == 'macos-latest' && '/bin/bash' || 'bash' }}
        run: bats tests/

  fresh-ubuntu:
    # The real piped path on a stock Ubuntu image with no git or curl (SPEC §11).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: pin the commit under test to a branch the bootstrap can clone
        run: git checkout -B ci-under-test
      - name: curl | bash in ubuntu:24.04
        run: docker run --rm -e KIT_REF=ci-under-test -v "$PWD:/src:ro" ubuntu:24.04 bash /src/tests/fresh-ubuntu.sh
