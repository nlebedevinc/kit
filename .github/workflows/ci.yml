name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          shellcheck install.sh bin/* lib/*.sh modules/*.sh tests/stubs/* tests/container.sh
          shellcheck -s bash tests/*.bats tests/helpers.bash

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: install bats, jq, jsonschema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats jq python3-jsonschema
      - name: bats (stdin is /dev/null: nothing may prompt)
        run: bats tests/ </dev/null

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@v5
      - name: pin the commit under test to a branch the bootstrap can clone
        run: git checkout -B ci-under-test
      - name: install.sh --dry-run --yes --non-interactive in ${{ matrix.image }}
        run: docker run --rm -e BEAST_REF=ci-under-test -v "$PWD:/src:ro" ${{ matrix.image }} bash /src/tests/container.sh
